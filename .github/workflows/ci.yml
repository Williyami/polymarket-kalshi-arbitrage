name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and import check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      # Syntax errors and undefined names only — always worth failing on.
      - name: Ruff (errors)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Ruff (full)
        run: ruff check .
        continue-on-error: true

      # Catches import-time breakage without needing market data or network.
      - name: Import modules
        run: |
          python -c "import arb_engine"
          python -c "import arb_engine_bidirectional"
          python -c "import api_client"
        continue-on-error: true